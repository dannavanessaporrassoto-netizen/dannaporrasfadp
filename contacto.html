<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Danna Porras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Encabezado y Navegación -->
    <header class="site-header">
        <div class="logo-container">
            <h1>DANNA PORRAS</h1>
            <span class="sub-logo">MODELO LINGÜÍSTICO</span>
        </div>
        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="site-nav" id="siteNav">
            <ul>
                <li><a href="index.html">INICIO</a></li>
                <li><a href="portafolio.html">PORTAFOLIO</a></li>
                <li><a href="contacto.html" class="active">CONTACTO</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contenido Principal - Contacto -->
    <main class="main-contact">
        <section class="contact-section">
            <div class="contact-card">
                <h2>Formulario de contacto</h2>
                <form id="contactForm">
                    <div class="form-group">
                        <label for="nombre">Nombre completo</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="correo">Correo electrónico</label>
                        <input type="email" id="correo" name="correo" required>
                    </div>
                    <div class="form-group">
                        <label for="mensaje">Mensaje</label>
                        <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn" style="display:none;"></button>
                </form>
            </div>
        </section>
    </main>

    <!-- Pie de página de contacto -->
    <footer class="contact-footer">
        <div class="footer-info">
            <div class="footer-item">
                <span class="icon">✉</span>
                <span>dannaporras@modelolinguistico.com</span>
            </div>
            <div class="footer-item">
                <span class="icon">📞</span>
                <span>(123) 456-7890</span>
            </div>
        </div>
    </footer>

    <!-- Script Externo -->
    <script src="script.js"></script>
</body>
</html>
